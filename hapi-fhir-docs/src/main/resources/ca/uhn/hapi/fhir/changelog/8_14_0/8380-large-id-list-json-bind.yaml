---
type: fix
issue: 8380
jira: SMILE-12621
title: "Searches whose _id or reference parameter carried more than 800 values (for example the automatic search
narrowing performed for a user holding tens of thousands of compartment grants) could exceed the database's limit
on the number of bind parameters in a single statement. Above a configurable threshold
(StorageSettings#setLargeIdListJsonThreshold, default 800) the ID list is now bound as a single JSON array parameter
on PostgreSQL, Oracle and SQL Server. On SQL Server this requires database compatibility level 130 or higher; below
that level the previous one-parameter-per-ID behaviour is kept and a warning is logged."
