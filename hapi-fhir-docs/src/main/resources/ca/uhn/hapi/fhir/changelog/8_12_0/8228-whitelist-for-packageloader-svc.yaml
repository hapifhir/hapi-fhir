---
type: security
issue: 8228
title: "`PackageLoaderSvc` can now be configured with an allow list of URL prefixes that
  are permitted when loading Implementation Guides and other NPM packages. The allow list
  is supplied by providing an `IPackageUrlAllowListProvider` bean; when none is provided,
  all URLs are permitted (equivalent to `*`). Regardless of the configured allow list, package URLs are
  always restricted to the `file:`, `classpath:`, `http:`, and `https:` schemes.
"
