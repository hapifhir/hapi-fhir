---
type: fix
issue: 8402
title: "When a code was validated or looked up against a specific version of a code system, a different version
  of that code system could be used instead, without any warning. A remote terminology server could also report
  the version as unknown even though it held it. The version that was asked for is now used. If that
  version is not available, validation fails with the error 'A definition for CodeSystem ... version ... could
  not be found, so the code cannot be validated', as the HL7 validator reports it."
