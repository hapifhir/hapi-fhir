---
type: fix
issue: 8805
title: "After a SNAPSHOT terminology upload replaced a code system version that was already stored,
  `CodeSystem/$lookup` returned the code system URL as `name` instead of the `CodeSystem.name` from the upload.
  This happened, for example, when a custom terminology was uploaded again as a SNAPSHOT. The uploaded
  `CodeSystem.name` is now stored. Code system versions already stored with the URL as their name keep it until
  they are uploaded again as a SNAPSHOT; see the upgrade notes."
