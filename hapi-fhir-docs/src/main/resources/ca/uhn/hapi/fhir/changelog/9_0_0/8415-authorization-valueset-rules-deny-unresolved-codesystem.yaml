---
type: security
issue: 8415
title: "`AuthorizationInterceptor` rules using `withCodeInValueSet`, `withCodeNotInValueSet`, or a `withFilter`
  expression with `:in` or `:not-in`, now deny access when the server cannot tell whether a code is in the
  `ValueSet`: when the `ValueSet` uses a `CodeSystem`, or `CodeSystem` version, that the server does not have, or,
  for a filter, when the server does not have the `ValueSet`. Before, some of these rules allowed reads they should
  have denied. A `ValueSet` pre-expanded before upgrading keeps its earlier expansion, so these rules keep answering
  from it until it is re-expanded. See the
  upgrade notes to find these `ValueSet`s."
