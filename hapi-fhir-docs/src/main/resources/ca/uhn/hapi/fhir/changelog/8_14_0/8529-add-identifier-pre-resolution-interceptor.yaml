title: "An interceptor has been added that can be used to pre-resolve chained identifier searches (e.g. upon receiving a query like `Observation?subject.identifier=http://foo|123` this interceptor will resolve the subject identifier and replace the query with an equivalent unchained query such as `Observation?subject=Patient/123`. This performs better at large scale, especially on heavily loaded systems."
