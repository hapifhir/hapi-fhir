---
type: change
issue: 8415
title: "Resource validation reported two or three overlapping issues for a code from an unknown `CodeSystem` (one
  the server does not have, in any version or at the version named). It now reports the unknown `CodeSystem` once, at
  a severity set by the binding strength, and `ValidationMessageUnknownCodeSystemPostProcessingInterceptor` now also
  sets the severity when only the version is unknown. A code that a `ValueSet` does not list, where nothing else in
  the `ValueSet` could contain it, is still reported as not in the `ValueSet`, whatever severity is set for the
  unknown `CodeSystem`, and an exclude that lists its codes only removes those codes."
