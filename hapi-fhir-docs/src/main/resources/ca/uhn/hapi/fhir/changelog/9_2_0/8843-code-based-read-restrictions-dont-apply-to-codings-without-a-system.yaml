---
type: security
issue: 8843
title: "Previously, `AuthorizationInterceptor` deny rules using `withCodeInValueSet` or `withCodeNotInValueSet` did
  not deny resources with a `Coding` that has no `system`, or with no code they could check. This applied to both
  reads and writes, and has been fixed. A deny rule using `withCodeInValueSet` now also denies a `Coding` without a
  `system` whose code is not in the `ValueSet`, and a `Coding` with a `system` but no `code`. A deny rule using
  `withCodeNotInValueSet` now denies a `Coding` without a `system` even when another code is in the `ValueSet`."
