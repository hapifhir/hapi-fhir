---
type: change
issue: 8428
title: "`ChannelProducerSettings#setProducerNameSuffix` and `getProducerNameSuffix` are deprecated for removal. No
      broker implementation reads the suffix, so setting it has no effect and calls to it can be removed. Some
      brokers treat a producer name as an exclusive claim on a topic and reject a second producer using a name that
      is still connected, so deriving a producer name from the channel name meant a replacement producer could be
      refused while the producer it replaced was still closing. Producers are left unnamed, and the broker assigns
      each one a unique name.
"
