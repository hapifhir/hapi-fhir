type: fix
issue: 8476
jira: SMILE-12898
title: "Resubmitting an unchanged resource with an auto-versioned reference in a FHIR transaction
  created a new version of it. Such resources are now no-ops, unless another resource in the same
  transaction has an auto-versioned reference to them. Also, an auto-versioned inline match URL
  reference to a resource left unchanged by the transaction no longer points to a nonexistent version."
