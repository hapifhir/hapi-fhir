---
type: fix
issue: 8763
title: "Storing a resource failed when a Number search parameter indexed a UCUM duration (for example DSTU3
  `Encounter.length`) in units such as `d`, `wk`, `mo` or `a`, an annotated unit such as `min{stay}`, or a unit
  that is not a unit of time. These resources are now stored and indexed: units of time are converted to days
  using the UCUM definitions (`a` is 365.25 days and `mo` is 30.4375 days), and other units are indexed with
  their value unchanged. Values in seconds, minutes and hours, and in `day`, `week`, `month` and `year`, are
  indexed as before. HAPI FHIR now uses the `org.fhir:ucum` library for this, and no longer includes the
  unmaintained `jscience` and `javolution` libraries. Rarely used unit names that only jscience understood, such
  as `year_sidereal`, are now indexed with their value unchanged, so reindexing changes their indexed value."
