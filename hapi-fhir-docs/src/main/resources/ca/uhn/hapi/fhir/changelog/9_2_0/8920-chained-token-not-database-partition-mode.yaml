---
type: fix
issue: 8920
title: "Previously, with database partition mode enabled, a chained `:not` search, such as
  `Observation?encounter.class:not=AMB`, did not match the target resource on `PARTITION_ID`. Databases that require
  it, such as distributed PostgreSQL, rejected the search with `HAPI-1262` and the error \"complex joins are only
  supported when all distributed tables are co-located and joined on their distribution columns\". This problem is
  fixed."
