---
type: security
issue: 8228
title: "Package loading now validates HTTP redirects against the allowlist. The allowlist is only
      matched against the URL that is requested, so a redirect from an allowlisted URL could
      previously fetch the package from a location that is not on the allowlist. Redirect targets
      are now matched against the allowlist before being followed, at most five hops are followed,
      and a redirect that downgrades `https:` to `http:` or loops back to an already-visited URL
      fails the fetch. A registry or mirror that redirects (for example to a CDN) must have the
      final URL added to the allowlist.
"
