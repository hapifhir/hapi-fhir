---
type: security
issue: 8446
title: "Previously, AuthorizationInterceptor only authorized the searched resource type, not the resource types
  named in reverse chaining (`_has`) parameters. As a consequence, a client allowed to read Patient but not
  Observation could trigger a reversed search traversing Observations (`Patient?_has:Observation:subject:code=X`),
  potentially leaking PHI. The AuthorizationInterceptor can now enforce authorization evaluation on resource types
  reached by a request with a `_has` parameter.

  Reverse chained searches do not check authorization by default. To enable authorization checking and configure
  read rules, see
  [Authorizing Reverse Chained Searches](/hapi-fhir/docs/security/authorization_interceptor.html#authorizing-reverse-chained-searches)."
