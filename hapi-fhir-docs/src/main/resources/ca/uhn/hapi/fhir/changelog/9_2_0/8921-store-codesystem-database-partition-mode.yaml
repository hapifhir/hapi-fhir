---
type: fix
issue: 8900
jira: SMILE-13244
title: "Previously, with database partition mode enabled, creating or updating a `CodeSystem` with a URL ran a query
  that did not match on `PARTITION_ID`. Databases that require it, such as distributed PostgreSQL, rejected the request
  with `HAPI-2223` and the error \"complex joins are only supported when all distributed tables are co-located and
  joined on their distribution columns\", so installing a package that contains such a `CodeSystem` failed too. This
  problem was introduced in HAPI FHIR 9.0.0 and is now fixed."
