title: "HAPI FHIR no longer brings in three libraries it does not use: the Elastic APM agent API
  (`co.elastic.apm:apm-agent-api`), JGit (`org.eclipse.jgit:org.eclipse.jgit`) and JavaEWAH
  (`com.googlecode.javaewah:JavaEWAH`). Applications that use any of them directly must now declare them."
