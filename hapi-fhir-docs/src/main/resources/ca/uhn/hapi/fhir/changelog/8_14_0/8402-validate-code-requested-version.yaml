---
type: fix
issue: 8402
title: "Previously, `$validate-code` did not always validate against the code system or value set version named in
  the request. Now:

  * `CodeSystem/$validate-code` uses the version on a `coding`, and when called on an instance, the version of that
    instance rather than the current one.

  * `CodeSystem/$validate-code` accepts a `url` that carries a version, such as `http://loinc.org|2.77`, together
    with a `coding`.

  * `ValueSet/$validate-code` accepts a `url` or `system` that already carries a version together with the
    `valueSetVersion` or `systemVersion` parameter.

  * `ValueSet/$validate-code` validates a `coding`, or a `codeableConcept` coding, of the `system` code system that
    has no version against the version given in `systemVersion` or carried by `system`, rather than the current
    one."
