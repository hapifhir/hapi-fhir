type: add
issue: 8317
jira: SMILE-12697
title: "MDM rule definitions can now map a resource type to more than one Enterprise Identifier (EID)
  system. Each entry in `eidSystems` accepts either a single system URI, as before, or an array of them.
  An incoming resource links to a golden resource if any of its EIDs match. Where a resource carries EIDs
  that resolve to different golden resources, it is linked to each as a POSSIBLE_MATCH and those golden
  resources are flagged as possible duplicates of one another."
