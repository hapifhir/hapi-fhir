title: "Added an interface, IPackageUrlContentFetcher, that allows implementers
        to register their own method of fetching packages from remote servers,
        for example to supply credentials for certain remote URLs. Any beans of
        this type are passed to PackageLoaderSvc, which consults them only after
        a package URL has passed the package URL allow-list.
