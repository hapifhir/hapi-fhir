---
type: fix
issue: 8402
title: "When a remote terminology service was configured, `ValueSet/$validate-code` ignored the `valueSetVersion`
  and `systemVersion` parameters and a `ValueSet` given by instance id; `CodeSystem/$validate-code` ignored the
  `version` parameter and did not support `codeableConcept`; and `CodeSystem/$lookup` sent the version inside
  `system` as `url|version`, which servers such as Ontoserver reject. These operations now behave the same as they
  do without a remote terminology service."
