type: change
issue: 8415
title: "`ValueSet/$validate-code` accepted a listed code even when its `CodeSystem` was unknown (the server did not have
  it). It now rejects the code and names the unknown `CodeSystem` in a new `x-caused-by-unknown-system` output parameter. See
  [ValueSets That Use an Unknown CodeSystem](/hapi-fhir/docs/validation/validation_support_modules.html#valuesets-that-use-an-unknown-codesystem)
  for details."
