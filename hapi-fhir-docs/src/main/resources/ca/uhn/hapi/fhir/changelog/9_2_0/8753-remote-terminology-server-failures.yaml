type: fix
issue: 8753
title: "When a remote terminology server answers with an HTTP 5xx error, or cannot be reached, `$validate` no longer fails with HTTP 500 and the remote's message. It returns a warning that names the remote server, and the remote's error is logged. A failed ValueSet or CodeSystem search treats that resource as unknown. `CodeSystem/$lookup` fails with HAPI-3067 naming the remote server."
