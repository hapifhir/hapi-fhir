type: fix
issue: 8753
title: "When a remote terminology server answers with an HTTP 5xx error or cannot be reached, `$validate` now returns HTTP 200 instead of failing with HTTP 500 and the remote server's message, and the remote server's error is logged. If the remote server fails a `CodeSystem/$validate-code` or `ValueSet/$validate-code` request, the other validation support modules are asked, and if none of them can check the code, the result is a warning that names the remote server and its error. If the remote server fails the search for a CodeSystem or ValueSet, the other modules are asked. Neither result is cached, so validation uses the remote server again as soon as it recovers. If the remote server fails a `CodeSystem/$lookup` request, `CodeSystem/$lookup` now fails with HTTP 500 and HAPI-3067, naming the remote server, instead of answering 404; during `$validate`, a module that looks the code up on the remote server then cannot check it, which gives the same warning. Answers with HTTP 4xx statuses are unchanged."
