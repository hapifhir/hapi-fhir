---
type: fix
issue: 8775
title: "If a `CodeSystem` was stored while a `ValueSet` using it was being pre-expanded, the `ValueSet` could be left
  with an expansion that was empty or missing codes. Until the `ValueSet` was pre-expanded again, `$expand`,
  `$validate-code` and `:in` searches could treat valid codes as not in the `ValueSet`. This started in 8.12.0. The
  `ValueSet` now ends up expanded from the `CodeSystem` as stored."
