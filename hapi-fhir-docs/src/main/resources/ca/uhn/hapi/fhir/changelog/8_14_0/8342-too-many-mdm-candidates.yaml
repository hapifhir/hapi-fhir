---
type: add
issue: 8342
title: "Added warning (defaulted to 50) and absolute (defaulted to 10000) thresholds for MDM
        matching when searching for candidates.
        
        When warning threshold is reached or exceeded, additional logging will result.
        When max threshold is reached or exceeded, the resource is tagged
        and omitted from MDM matching and no golden resource created.

        The following APIs have also changed:
        * `IMdmMatchFinderSvc.getMatchedTargets` now takes an additional `MdmTransactionContext` parameter
        * `IMdmResourceDaoSvc.tagResourceAsUnmatched` and `IMdmSettings.getCandidateSearchWarnLimit` have been added
"
