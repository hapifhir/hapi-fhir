---
type: add
issue: 8342
title: "Added warning and absolute thresholds for MDM matching when searching for candidates.
        When warning threshold (defaulted to 5) is reached or exceeded, additional logging will result.
        When max threshold (defaulted to 10000) is reached or exceeded, the resource is tagged
        and omitted from MDM matching (so as not to halt the system entirely). No Golden Resource
        is created for such a resource.

        This results in the following API changes:
        `IMdmMatchFinderSvc.getMatchedTargets` now takes an additional `MdmTransactionContext` parameter;
        `IMdmResourceDaoSvc.tagResourceAsUnmatched` and `IMdmSettings.getCandidateSearchWarnLimit` have been added;
        and `TooManyCandidatesException` has moved from `ca.uhn.fhir.jpa.mdm.svc.candidate` to
        `ca.uhn.fhir.mdm.model`. That exception is no longer thrown during MDM matching, which tags the
        resource instead; it is now only raised by `$mdm-match`, where there is no resource to tag.
"
