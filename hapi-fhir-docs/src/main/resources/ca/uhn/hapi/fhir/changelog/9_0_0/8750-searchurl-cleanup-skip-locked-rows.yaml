---
type: fix
issue: 8750
jira: SMILE-13074
title: "The scheduled cleanup of stale `HFJ_RES_SEARCH_URL` entries now skips rows that are locked by
  other transactions (`READPAST` on MSSQL, `SKIP LOCKED` on Postgres and Oracle) instead of waiting
  on them. Previously, a cleanup page that reached a row being cleared by an in-flight resource
  update, or by a concurrent cleanup on another node, blocked until the statement timed out and
  aborted the whole sweep. The number of rows deleted per cleanup transaction is now configurable
  via `JpaStorageSettings#setSearchUrlCleanupBatchSize(int)` (default 1,000, maximum 2,000)."
