---
type: fix
issue: 8032
title: 'Previously, a `Subscription` whose criteria used the `_filter` search parameter fired for every
resource of the matching type, because `_filter` was silently dropped when match URLs were parsed.
Match URLs now retain `_filter`, so subscription criteria and conditional create/update/delete honor it.
When `_filter` is disabled on the server, new `_filter` subscriptions are rejected and existing ones are
skipped instead of firing for everything. See the `_filter` section of the JPA server search documentation.'
