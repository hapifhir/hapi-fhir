---
type: security
issue: 9148
title: "The HAPI FHIR CLI's console colour library has been migrated from the deprecated
  `org.fusesource.jansi:jansi` to its maintained successor, `org.jline:jansi`, resolving CVE-2026-8484.
  Logback has been upgraded from 1.5.25 to 1.6.3, and the CLI's colour logging configuration now uses
  logback's new `JansiConsoleAppender` in place of `withJansi` on `ConsoleAppender`, which only ever
  supported the old library. Console colour handling is unchanged, including on legacy Windows consoles."
