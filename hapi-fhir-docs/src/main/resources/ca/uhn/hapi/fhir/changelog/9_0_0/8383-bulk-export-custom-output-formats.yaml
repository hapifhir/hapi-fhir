---
type: add
issue: 8383
title: "Bulk export can now emit formats other than NDJSON.
        A hook on the new `STORAGE_BULK_EXPORT_RESOURCE_CONVERT` pointcut receives the 
        `BulkExportJobParameters` and returns an `IResourceConverter`, which takes
        the expanded resources and returns the bytes and content type to store in each Binary.
        Returning a converter for an `_outputFormat` makes
        that format valid; returning null leaves the default behaviour in place,
        where NDJSON content types are written by the built-in writer and any other format is 
        rejected when the job starts.
        NDJSON remains the default, so behaviour is unchanged when no hook is registered.
"
