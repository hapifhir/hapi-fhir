---
type: add
issue: 8415
title: "A new setting, `JpaStorageSettings#setUseCurrentCodeSystemVersionWhenNamedVersionMissing`, lets a `ValueSet`
  that names a `CodeSystem` version the server does not have be checked against the current version instead of
  failing. It applies to `$expand`, `$validate-code`, `$validate`, pre-expansion, `:in` / `:not-in`
  searches and `AuthorizationInterceptor` `ValueSet` rules, where a code the current version lacks is still denied.
  It is off by default, which keeps the current behaviour. See
  [Using the Current Version](/hapi-fhir/docs/validation/validation_support_modules.html#use-current-codesystem-version)."
