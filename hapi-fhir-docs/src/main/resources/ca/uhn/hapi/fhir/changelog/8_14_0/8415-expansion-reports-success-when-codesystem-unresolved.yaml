---
type: fix
issue: 8415
title: "Codes listed in a `ValueSet` were expanded as members even when the server did not have their `CodeSystem`,
  or the `CodeSystem` version named. As the FHIR specification requires, `$expand` of such a `ValueSet` now returns an error (HTTP 400, naming the `CodeSystem`), JPA pre-expansion
  ends as `FAILED_TO_EXPAND`, and `:in` / `:not-in` searches over it, including searches narrowed by
  `SearchNarrowingInterceptor`, return an error instead of results based on codes that could not be checked."
