---
type: fix
issue: 8415
title: "Previously, codes listed in a `ValueSet` were accepted even when the server did not have their `CodeSystem`,
  or the `CodeSystem` version named. Now, as the FHIR specification requires:

  * `$expand` and `:in` / `:not-in` searches return an error.
  * `$validate-code` and instance validation reject the code and name the missing `CodeSystem`.
  * `AuthorizationInterceptor` rules using `withCodeInValueSet` or `withCodeNotInValueSet` deny access.
  * `$validate-code` against a `ValueSet` including the whole of a `not-present` `CodeSystem` with no codes loaded
    rejects the code and names the `CodeSystem`. `$expand` of such a `ValueSet` returns an error when expanded in
    memory; a JPA server still returns an empty expansion."
