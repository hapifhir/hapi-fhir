---
type: fix
issue: 8320
title: "Previously, when a bulk-modify batch job such as `$reindex` needed to defer a work chunk (for example,
  because terminology storage for a `CodeSystem` was still pending), the chunk failed instead and the job could
  end in a `FAILED` state with `HAPI-2790`. The chunk is now deferred and retried later.
  `RetryChunkLaterException`, `JobExecutionFailedException` and `ReductionStepFailureException` now implement
  the new marker interface `IBatch2FrameworkException`. Custom batch2 job steps that catch broad exception types
  such as `Exception` or `Throwable` must rethrow any exception implementing this interface so the framework can
  act on it."
