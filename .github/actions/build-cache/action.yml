name: "Build Cache Maven Dependencies"
description: "Caches Maven dependencies, resolves plugins, and builds if the cache is not hit."
inputs:
  java-version:
    description: "The Java version to use"
    required: false
    default: "21"
  cache-path:
    description: "The path for the Maven cache"
    required: false
    default: "$HOME/.m2/repository"

runs:
  using: "composite"
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: "temurin"

    - name: Restore Cached Maven dependencies
      id: load-cache
      uses: ./.github/actions/caching-handler
      with:
        key: ${{ github.ref_name }}-maven-${{ hashFiles('**/pom.xml') }}

    - name: Cache Hit or Miss
      shell: bash
      run: |
        if [[ "${{ steps.load-cache.outputs.cache-hit }}" == "true" ]]; then
          echo "Cache hit, skipping dependency resolution.";
        else
          echo "Cache miss, dependencies have been downloaded.";
        fi

    - name: Populate Cache with Remote Dependencies
      shell: bash
      if: steps.load-cache.outputs.cache-hit != 'true'
      env:
        MAVEN_CACHE_FOLDER: ${{ inputs.cache-path }}
      run: |
        mvn dependency:resolve dependency:resolve-plugins test-compile \
          surefire:help jacoco:help \
          -Dmaven.repo.local=$MAVEN_CACHE_FOLDER \
          -Dstyle.color=always -Djansi.force=true

    # Surefire and Failsafe download their JUnit provider (surefire-junit-platform) and a junit-platform-launcher
    # matching the project's JUnit version only when tests run. Nothing earlier in this job runs tests, so without
    # this step neither is in the cache and every test job downloads them from Maven Central at the same time.
    #
    # This is done here and not in pom.xml, because a provider declared as a dependency of the Surefire plugin brings
    # the junit-platform-launcher version it was built with (1.12.2 for Surefire 3.5.6). Surefire then uses that
    # launcher, and JUnit 6 tests fail at discovery with "OutputDirectoryCreator not available".
    - name: Populate Cache with Surefire Test Provider
      shell: bash
      if: steps.load-cache.outputs.cache-hit != 'true'
      env:
        MAVEN_CACHE_FOLDER: ${{ inputs.cache-path }}
      run: |
        SUREFIRE_VERSION=$(mvn help:evaluate -Dexpression=surefire_version -q -DforceStdout -N \
          -Dmaven.repo.local=$MAVEN_CACHE_FOLDER)
        JUNIT_VERSION=$(mvn help:evaluate -Dexpression=junit_version -q -DforceStdout -N \
          -Dmaven.repo.local=$MAVEN_CACHE_FOLDER)
        mvn dependency:get -N -B \
          -Dartifact=org.apache.maven.surefire:surefire-junit-platform:$SUREFIRE_VERSION \
          -Dmaven.repo.local=$MAVEN_CACHE_FOLDER
        mvn dependency:get -N -B \
          -Dartifact=org.junit.platform:junit-platform-launcher:$JUNIT_VERSION \
          -Dmaven.repo.local=$MAVEN_CACHE_FOLDER

    - name: Build with Maven
      shell: bash
      env:
        MAVEN_CACHE_FOLDER: ${{ inputs.cache-path }}
        MAVEN_OPTS: '-Xmx1024m -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss,SSS -Duser.timezone=America/Toronto'
      run: |
        mvn clean install -P CI \
          -Dmaven.test.skip=true -e -B \
          -Dmaven.javadoc.skip=true \
          -Dmaven.wagon.http.pool=false \
          -Dmaven.repo.local=$MAVEN_CACHE_FOLDER \
          -Dhttp.keepAlive=false \
          -Dstyle.color=always -Djansi.force=true

    #   Developers might change HAPI modules during bug fixing or feature implementation, so we want to cache the maven
    #   dependencies separately from the HAPI dependencies.
    - name: Cache HAPI dependencies
      id: save-cache-hapi
      uses: ./.github/actions/caching-handler
      with:
        path: "$HOME/.m2/repository/ca/uhn/"
        key: ${{ github.ref_name }}-hapi-${{ github.run_id }}
        save: 'true'

    - name: Cache Maven dependencies
      id: save-cache-all
      if: steps.load-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/caching-handler
      with:
        key: ${{ github.ref_name }}-maven-${{ hashFiles('**/pom.xml') }}
        save: 'true'
        exclude: "$HOME/.m2/repository/ca/uhn/"
