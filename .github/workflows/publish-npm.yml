# Created by Claude Opus 5.5
#
# Publishes the @smile-cdr/fhirts TypeScript models to npmjs.com using npm trusted publishing (OIDC).
#
# This must be run on a release tag (vX.Y.Z), after the release has been published to Sonatype. This is triggered by
# the Azure release pipeline.
name: Publish TypeScript Models to npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # Required for OIDC

    steps:
      - name: Verify the run is on a release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != "tag" || ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish from $REF_TYPE '$REF_NAME': run this workflow on a release tag such as v8.14.0"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1 and uses the versions pinned here.
      # The Maven build still uses its own pinned versions (in hapi-fhir-typescript/pom.xml)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Build TypeScript models
        run: mvn -B -ntp -pl hapi-fhir-typescript -am install -DskipTests

      # Snapshots and pre-releases (-SNAPSHOT, -PRE*) never match a release tag, so they are refused here.
      - name: Verify the node package version matches the release tag
        working-directory: hapi-fhir-typescript/target/npm
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "v$version" != "$REF_NAME" ]]; then
            echo "Refusing to publish: package version $version does not match release tag $REF_NAME"
            exit 1
          fi

      - name: Publish to npm
        working-directory: hapi-fhir-typescript/target/npm
        run: npm run publish-if-new
