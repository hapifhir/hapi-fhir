name: Pull Request Pipeline

on:
  pull_request:

jobs:
  load-config-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Load ignored modules from config
        id: load_config
        run: |
          IGNORED=$(yq '.ignored_modules' .github/config/ignored-modules.yml | tr -d '"')
          echo "ignored_modules=$IGNORED" >> $GITHUB_OUTPUT

    outputs:
      ignored_modules: ${{ steps.load_config.outputs.ignored_modules }}

  run-parallel-build:
    needs: load-config-and-run
    uses: ./.github/workflows/parallel-pipeline-build.yml
    with:
      ignored_modules: ${{ needs.load-config-and-run.outputs.ignored_modules }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fail the PR if a changelog entry newly added in this PR is in the wrong version directory for the
  # target branch (GL-8831). Only files ADDED in this PR are enforced — pre-existing entries are never
  # re-validated, and edits to existing entries (e.g. a typo fix in an older release dir) are allowed.
  changelog-location:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changelog location
        run: |
          set -euo pipefail
          changelog_root="hapi-fhir-docs/src/main/resources/ca/uhn/hapi/fhir/changelog"

          git fetch --quiet origin "$GITHUB_BASE_REF"

          # Changelog entries newly ADDED in this PR: number-prefixed .yml/.yaml under the changelog tree.
          # Edits to existing entries (diff-filter M) are intentionally excluded so typo fixes in older
          # release dirs do not fail.
          mapfile -t entries < <(git diff --name-only --diff-filter=A "origin/$GITHUB_BASE_REF...HEAD" \
            | grep -E "^${changelog_root}/(.*/)?[0-9][^/]*\.ya?ml$" || true)

          if [ "${#entries[@]}" -eq 0 ]; then
            echo "No changelog entries added/changed in this PR — nothing to check."
            exit 0
          fi

          # Project version from the root pom (the project <version> is the first one in the file).
          pom_version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)
          echo "pom version: $pom_version"

          # Only enforce for -SNAPSHOT versions.
          if [[ "$pom_version" != *-SNAPSHOT ]]; then
            echo "pom version is not -SNAPSHOT — skipping changelog location check."
            exit 0
          fi

          base_ver="${pom_version%-SNAPSHOT}"
          if [[ ! "$base_ver" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "pom version '$pom_version' is not major.minor.patch — skipping changelog location check."
            exit 0
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if [[ "$GITHUB_BASE_REF" == "master" ]]; then
            # master carries the odd-minor development version for the next (even-minor) release, so the
            # changelog dir is one minor ahead of the pom: 8.13.0-SNAPSHOT -> 8_14_0.
            expected="${changelog_root}/${major}_$((minor + 1))_0"
          elif [[ "$GITHUB_BASE_REF" =~ ^rel_([0-9]+)_([0-9]+)$ ]]; then
            # The branch name is authoritative for major/minor. A freshly cut release branch still carries the
            # development version it inherited from master (rel_8_12 sits at 8.11.19-SNAPSHOT) until it is
            # bumped, so the pom minor cannot be trusted here.
            rel_major="${BASH_REMATCH[1]}"
            rel_minor="${BASH_REMATCH[2]}"
            if [[ "$major" == "$rel_major" && "$minor" == "$rel_minor" ]]; then
              # Already bumped: the pom patch identifies the release in flight, e.g. rel_8_10 at
              # 8.10.2-SNAPSHOT -> 8_10_2.
              expected="${changelog_root}/${rel_major}_${rel_minor}_${patch}"
            else
              # Not bumped yet, so the release in flight is X.Y.0.
              expected="${changelog_root}/${rel_major}_${rel_minor}_0"
            fi
          else
            echo "Target branch '$GITHUB_BASE_REF' is not master or rel_X_Y — skipping changelog location check."
            exit 0
          fi
          echo "Expected changelog directory: $expected"

          status=0
          for f in "${entries[@]}"; do
            if [[ "$(dirname "$f")" != "$expected" ]]; then
              echo "::error file=$f::Changelog '$f' is in the wrong directory for target branch '$GITHUB_BASE_REF'. Expected it in '$expected/' (pom version '$pom_version')."
              status=1
            fi
          done
          exit $status
