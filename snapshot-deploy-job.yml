# Shared job template for SNAPSHOT deployment pipelines.
# Referenced by snapshot-pipeline.yml and snapshot-release-pipeline.yml

jobs:
  - job: DeploySnapshot
    timeoutInMinutes: 90

    # We'll run the process on the latest version of ubuntu because they tend to be the fastest
    pool:
      vmImage: 'ubuntu-latest'

    # We cannot store things like gpg passwords and sonatype credentials as plain text within the
    # pipeline's yaml file, so we've created variable groups in our library to store sensitive variables.
    # Pipelines do not load these groups by default, and we need to define which groups to load before
    # running any steps.
    variables:
      - group: GPG_VARIABLE_GROUP
      - group: CENTRAL_VARIABLE_GROUP
      - group: SLACK_VARIABLE_GROUP
      - name: MAVEN_OPTS
        value: ''

    container:
      image: smilecdr/hapi-build:latest

    steps:

      # Microsoft-hosted images ship with a bunch of preinstalled SDKs we don't use (.NET, Android, Haskell)
      # that eat into the free disk space on the VM. The WAR assembly step for hapi-fhir-jpaserver-uhnfhirtest
      # has failed with "No space left on device" on this job before, so we clear that space up front.
      # This runs with `target: host` because the rest of the job's steps execute inside the container
      # defined above, but these preinstalled SDKs live on the host VM.
      - bash: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          echo "Disk space after cleanup:"
          df -h /
        displayName: 'Free up host disk space before build'
        target: host

      # This job deploys whatever version the branch currently declares, and Maven decides
      # release-vs-snapshot from the version string alone. If a release branch has already been
      # bumped to a non-SNAPSHOT version, a scheduled run here would publish a real, immutable
      # release to Maven Central rather than a snapshot. Fail fast instead.
      - bash: |
          version=$(mvn -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          echo verifying that project version $version is a SNAPSHOT before deploying...
          if [[ "$version" == *-SNAPSHOT ]]
          then
            echo "version $version is a SNAPSHOT, proceeding..."
          else
            echo "version $version is not a SNAPSHOT, refusing to deploy - releases must go through the release pipeline"
            exit 1
          fi
        displayName: 'Verify project version is a SNAPSHOT'

      # We need a valid signing key to sign our builds for deployment to sonatype. We have uploaded
      # both our private and public keys to Azure as 'secure files' that we load into individual pipelines.

      # 1. Load the public key file
      - task: DownloadSecureFile@1
        displayName: 'Load public key from secure files.'
        inputs:
          secureFile: public.key

      # 2. Load the private key file
      - task: DownloadSecureFile@1
        displayName: 'Load private key from secure files.'
        inputs:
          secureFile: private.key

      # Although we have imported the key files into our workspace, GPG has no knowledge that these keys exist.
      # We use a bash script to import both the private and public keys into gpg for future signing.
      # 3. Import keys into gpg
      - bash: |
          gpg --import --no-tty --batch --yes $(Agent.TempDirectory)/public.key
          gpg --import --no-tty --batch --yes $(Agent.TempDirectory)/private.key
          gpg --list-keys --keyid-format LONG
          gpg --list-secret-keys --keyid-format LONG
        displayName: 'Import signing keys into gpg.'

      # For creating a snapshot release with maven, we need to build a fake settings.xml file locally where
      # we can set our credentials for both sonatype and gpg. Then maven can read
      # for it to read from.

      # 4. Create local settings.xml file
      - bash: |
          cat >$(System.DefaultWorkingDirectory)/settings.xml <<EOL
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>$(CENTRAL_USERNAME)</username>
                <password>$(CENTRAL_PASSWORD)</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>SIGN_ARTIFACTS</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>
                <properties>
                  <gpg.passphrase>$(GPG_PASSPHRASE)</gpg.passphrase>
                </properties>
              </profile>
            </profiles>
          </settings>
          EOL
        displayName: 'Create .mvn/settings.xml'

      # With our settings.xml created locally, we can now run maven (pointing to our created settings.xml file) to deploy
      # the HAPI SNAPSHOT build.

      # 5. Deploy SNAPSHOT build to sonatype
      - task: Maven@4
        displayName: 'Deploy to Maven Central staging'
        inputs:
          mavenPomFile: '$(System.DefaultWorkingDirectory)/pom.xml'
          goals: deploy
          options: '--settings $(System.DefaultWorkingDirectory)/settings.xml -P DIST -DskipTests -DdeployToCentral --batch-mode --no-transfer-progress --threads 1C --fail-at-end -Dstyle.color=never '
          mavenOptions: '-Xmx2048m -XX:+UseG1GC $(MAVEN_OPTS)'
          publishJUnitResults: false

      # 6. Notify Slack if a scheduled deploy failed. If the notification cannot be sent, the step logs a warning
      #    saying why and still succeeds. Manual runs do not notify: whoever queued the run is watching it.
      #    To mute a pipeline's notifications, set the pipeline variable SKIP_SLACK_NOTIFICATION to true in Azure.
      - bash: |
          # Azure passes an undefined variable's reference through unexpanded, so check for that as well as empty
          for name in SLACK_PROXY_HOOK_URL SLACK_SENDER_TOKEN SLACK_CHANNEL; do
            if [[ -z "${!name}" || "${!name}" == '$('* ]]; then
              echo "##vso[task.logissue type=warning]Slack notification not sent: ${name} is not set. Check the SLACK_VARIABLE_GROUP variable group."
              exit 0
            fi
          done
          PIPELINE_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"

          # Azure records only "Build failed." for a failed step, so take the cause from the step's own log:
          # Maven's "Failed to execute goal" line, or else the last lines the step printed
          FAILED_STEP="unknown"
          FAILURE_DETAIL="The failed step's log could not be read."
          builds_api="${COLLECTION_URI}${PROJECT_ID}/_apis/build/builds/${BUILD_ID}"
          auth=()
          if [[ -n "${SYSTEM_ACCESSTOKEN}" && "${SYSTEM_ACCESSTOKEN}" != '$('* ]]; then
            auth=(-H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}")
          fi
          if timeline=$(curl -sS --fail --max-time 30 "${auth[@]}" "${builds_api}/timeline?api-version=7.1"); then
            read -r log_id step_name < <(jq -r '[.records[] | select(.type == "Task" and .result == "failed")][0] | "\(.log.id // "-") \(.name // "unknown")"' <<< "${timeline}")
            FAILED_STEP=${step_name:-unknown}
            if [[ -n "${log_id}" && "${log_id}" != "-" ]] \
                && step_log=$(curl -sS --fail --max-time 60 "${auth[@]}" "${builds_api}/logs/${log_id}?api-version=7.1"); then
              step_output=$(tr -d '\r' <<< "${step_log}" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ?//')
              # A script step's own output starts after Azure's "Starting Command Output" line
              if grep -q 'Starting Command Output' <<< "${step_output}"; then
                step_output=$(sed '1,/Starting Command Output/d' <<< "${step_output}")
              fi
              step_output=$(grep -v '^##\[\|^\[command\]' <<< "${step_output}")
              FAILURE_DETAIL=$(grep -m 1 -F '[ERROR] Failed to execute goal' <<< "${step_output}" \
                || grep -v '^[[:space:]]*$' <<< "${step_output}" | tail -n 3)
              FAILURE_DETAIL=${FAILURE_DETAIL:0:600}
            fi
          fi
          FAILURE_TEXT=$(jq -Rs . <<< "*Failed step:* ${FAILED_STEP}"$'\n''```'"${FAILURE_DETAIL}"'```')

          response_file=$(mktemp)
          curl_status=0
          http_status=$(curl -sS --max-time 30 -o "${response_file}" -w '%{http_code}' -X POST "${SLACK_PROXY_HOOK_URL}" \
            -H 'Content-Type: application/json' \
            -H "X-Slack-Sender-Token: ${SLACK_SENDER_TOKEN}" \
            --data "{
              \"channel\": \"${SLACK_CHANNEL}\",
              \"author\": \"${SLACK_AUTHOR}\",
              \"text\": \"HAPI FHIR Nightly SNAPSHOT Deploy Failed\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \":red_circle: HAPI FHIR Nightly SNAPSHOT Deploy Failed\",
                    \"emoji\": true
                  }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    { \"type\": \"mrkdwn\", \"text\": \"*Pipeline:*\n${PIPELINE_NAME}\" },
                    { \"type\": \"mrkdwn\", \"text\": \"*Branch:*\n\`${BRANCH_NAME}\`\" },
                    { \"type\": \"mrkdwn\", \"text\": \"*Build:*\n<${PIPELINE_URL}|${BUILD_NUMBER}>\" },
                    { \"type\": \"mrkdwn\", \"text\": \"*Reason:*\n${BUILD_REASON}\" }
                  ]
                },
                { \"type\": \"section\", \"text\": { \"type\": \"mrkdwn\", \"text\": ${FAILURE_TEXT} } },
                { \"type\": \"divider\" },
                {
                  \"type\": \"context\",
                  \"elements\": [
                    { \"type\": \"mrkdwn\", \"text\": \"Nightly SNAPSHOT build failure notification\" }
                  ]
                }
              ]
            }") || curl_status=$?
          if [[ ${curl_status} -ne 0 || ${http_status} != 2* ]]; then
            echo "##vso[task.logissue type=warning]Slack notification not sent: curl exit code ${curl_status}, HTTP status ${http_status}."
            cat "${response_file}"
            echo
          fi
        displayName: 'Notify Slack on failure'
        # On the agent host, which has jq; the build container does not
        target: host
        condition: and(failed(), eq(variables['Build.Reason'], 'Schedule'), ne(variables['SKIP_SLACK_NOTIFICATION'], 'true'))
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          COLLECTION_URI: $(System.TeamFoundationCollectionUri)
          PROJECT_ID: $(System.TeamProjectId)
          BUILD_ID: $(Build.BuildId)
          SLACK_PROXY_HOOK_URL: $(SLACK_PROXY_HOOK_URL)
          SLACK_SENDER_TOKEN: $(SLACK_SENDER_TOKEN)
          SLACK_CHANNEL: $(SLACK_CHANNEL)
          SLACK_AUTHOR: $(SLACK_AUTHOR)
          PIPELINE_NAME: $(Build.DefinitionName)
          BRANCH_NAME: $(Build.SourceBranchName)
          BUILD_NUMBER: $(Build.BuildNumber)
          BUILD_REASON: $(Build.Reason)
